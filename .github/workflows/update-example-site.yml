name: Update Example Site
permissions:
  contents: write
  id-token: write
  pages: write
  pull-requests: write
  checks: write
  statuses: write
  actions: write
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'  # Every Sunday at midnight

jobs:
  update-example-site:
    runs-on: ubuntu-latest
    env:
      DATE: ${{ format('YYYY-MM-DD', github.event.repository.pushed_at) }}
      
    steps:
      - name: Set date
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
      
      - name: Set branch name
        run: echo "BRANCH_NAME=update/exampleSite-${DATE}" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Node.js dependencies
        run: npm i

      - name: Update example site content
        run: |
          cd exampleSite
          ../node_modules/@zetxek/adritian-theme-helper/dist/scripts/download-content.js

      - name: Create new branch
        run: |
          git checkout -b ${{ env.BRANCH_NAME }}

      - name: Commit changes
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'actions@github.com'
          git add .
          git commit -m "Update example site content"

      - name: Push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin ${{ env.BRANCH_NAME }}

      - name: Close superseded PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list --state open --json number,headRefName --limit 100 | \
          jq -r --arg branch "${{ env.BRANCH_NAME }}" '.[] | select(.headRefName | startswith("update/exampleSite-")) | select(.headRefName != $branch) | .number' | \
          while read -r pr_number; do
            gh pr close "$pr_number" --comment 'Superseded by a newer ExampleSite content update.' --delete-branch
          done
          exit 0

      - name: Create Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_TITLE="ExampleSite content update (${DATE})"
          PR_BODY="This automated PR updates the example site with the latest content from [adritian-demo](https://github.com/zetxek/adritian-demo).
          
          **Overview of changes:**

          <code>
          $(git diff --stat HEAD~1)
          </code>"
          gh pr create --title "$PR_TITLE" --body "$PR_BODY" --base main --head "${{ env.BRANCH_NAME }}"
